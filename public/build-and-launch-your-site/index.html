<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build & Launch Your Website</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-soft: #f7f6f3;
    --bg-card: #ffffff;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --text-faint: #999;
    --border: #e5e3de;
    --border-strong: #ccc;
    --accent: #1a56db;
    --accent-bg: #eff4ff;
    --accent-text: #1e40af;
    --success: #0a7c4e;
    --success-bg: #ecfdf5;
    --success-border: #6ee7b7;
    --warning: #92400e;
    --warning-bg: #fffbeb;
    --danger: #991b1b;
    --danger-bg: #fef2f2;
    --code-bg: #f4f3f0;
    --radius: 10px;
    --radius-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --bg-soft: #1a1a19;
      --bg-card: #1e1e1d;
      --text: #e8e6e0;
      --text-muted: #999;
      --text-faint: #666;
      --border: #2a2a28;
      --border-strong: #444;
      --accent: #4f8ef7;
      --accent-bg: #1a2540;
      --accent-text: #93bbfc;
      --success: #34d399;
      --success-bg: #052e1a;
      --success-border: #065f3a;
      --warning: #fbbf24;
      --warning-bg: #1f1500;
      --danger: #f87171;
      --danger-bg: #2d0a0a;
      --code-bg: #252523;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-soft);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.6;
  }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
  }
  .header-inner {
    max-width: 720px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px;
  }
  .phase-label { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .progress-bar-wrap { flex: 1; background: var(--border); border-radius: 99px; height: 5px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
  .step-counter { font-size: 12px; color: var(--text-faint); white-space: nowrap; }

  .main { max-width: 720px; margin: 0 auto; padding: 28px 24px 120px; }

  .step-card { display: none; animation: fadein 0.2s ease; }
  .step-card.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Already done banner */
  .done-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .done-banner-left { display: flex; align-items: center; gap: 8px; color: var(--success); font-weight: 500; }
  .done-banner-undo { font-size: 12px; color: var(--text-faint); cursor: pointer; text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0; }
  .done-banner-undo:hover { color: var(--text-muted); }

  .skip-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 14px;
    color: var(--text-muted);
  }
  .skip-btn {
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid var(--success-border);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .skip-btn:hover { opacity: 0.85; }

  .phase-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em;
    padding: 4px 10px; border-radius: 99px; margin-bottom: 14px;
    background: var(--accent-bg); color: var(--accent-text);
  }

  h1.step-title { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.25; margin-bottom: 8px; }
  .step-subtitle { font-size: 16px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; }

  .steps-list { list-style: none; counter-reset: steps; display: flex; flex-direction: column; gap: 14px; margin: 20px 0; }
  .steps-list li { counter-increment: steps; display: flex; gap: 14px; align-items: flex-start; }
  .steps-list li::before {
    content: counter(steps); min-width: 26px; height: 26px;
    background: var(--accent-bg); color: var(--accent-text);
    border-radius: 50%; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .steps-list li .li-content { flex: 1; font-size: 15px; color: var(--text); line-height: 1.6; }
  .steps-list li .li-content strong { font-weight: 600; }

  .callout {
    border-radius: var(--radius); padding: 14px 16px; margin: 20px 0;
    font-size: 14px; line-height: 1.6; display: flex; gap: 10px;
  }
  .callout-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
  .callout-body strong { display: block; font-weight: 600; margin-bottom: 3px; font-size: 14px; }
  .callout.tip { background: var(--accent-bg); color: var(--accent-text); }
  .callout.tip .callout-icon::before { content: '💡'; }
  .callout.warning { background: var(--warning-bg); color: var(--warning); }
  .callout.warning .callout-icon::before { content: '⚠️'; }
  .callout.success { background: var(--success-bg); color: var(--success); }
  .callout.success .callout-icon::before { content: '✅'; }
  .callout.cost { background: var(--warning-bg); color: var(--warning); }
  .callout.cost .callout-icon::before { content: '💳'; }

  .code-wrap { position: relative; margin: 16px 0; }
  .code-block {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 16px;
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 13.5px; line-height: 1.7; color: var(--text);
    overflow-x: auto; white-space: pre;
  }
  .copy-btn {
    position: absolute; top: 8px; right: 8px;
    background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 4px 10px;
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--accent-bg); color: var(--accent-text); }
  .copy-btn.copied { background: var(--success-bg); color: var(--success); border-color: var(--success); }

  code {
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    background: var(--code-bg); padding: 1px 6px;
    border-radius: 4px; font-size: 13px; border: 1px solid var(--border);
  }

  .limits-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 16px 0; }
  .limits-table th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .limits-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  .limits-table tr:last-child td { border-bottom: none; }
  .limits-table td:last-child { color: var(--accent-text); font-weight: 500; }

  .hero { text-align: center; padding: 20px 0 32px; }
  .hero-icon { width: 72px; height: 72px; background: var(--accent-bg); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 20px; }
  .hero h1 { font-size: 30px; font-weight: 700; margin-bottom: 10px; }
  .hero p { font-size: 17px; color: var(--text-muted); max-width: 480px; margin: 0 auto 24px; }

  .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 20px 0; }
  .tool-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .tool-card .tool-icon { font-size: 24px; margin-bottom: 6px; }
  .tool-card .tool-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .tool-card .tool-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .tool-card .tool-cost { font-size: 11px; margin-top: 6px; padding: 2px 8px; border-radius: 99px; display: inline-block; }
  .tool-card .tool-cost.free { background: var(--success-bg); color: var(--success); }
  .tool-card .tool-cost.paid { background: var(--warning-bg); color: var(--warning); }

  /* Interactive form styles */
  .form-section { margin: 24px 0; }
  .form-section h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: var(--text); }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .form-hint { font-size: 12px; color: var(--text-faint); margin-bottom: 6px; display: block; }
  .form-input, .form-textarea, .form-select {
    width: 100%; padding: 10px 12px;
    background: var(--bg-card); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); font-size: 14px; color: var(--text);
    font-family: inherit; transition: border 0.15s;
    resize: vertical;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .form-textarea { min-height: 80px; line-height: 1.6; }
  .form-textarea.tall { min-height: 120px; }
  .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 6px; }
  .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .checkbox-item input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

  .output-section { margin-top: 24px; }
  .output-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .output-label .live-badge { font-size: 10px; background: var(--accent-bg); color: var(--accent-text); padding: 2px 7px; border-radius: 99px; }
  .output-box {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 16px;
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 13px; line-height: 1.7; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
    min-height: 120px;
  }
  .output-placeholder { color: var(--text-faint); font-style: italic; font-family: inherit; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* Nav */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg); border-top: 1px solid var(--border);
    padding: 14px 24px; z-index: 100;
  }
  .nav-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn { padding: 10px 22px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-secondary { background: var(--bg-soft); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-primary { background: var(--accent); color: #fff; min-width: 120px; }
  .btn-primary:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .nav-step-dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 300px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
  .dot.active { background: var(--accent); transform: scale(1.3); }
  .dot.done { background: var(--success); }

  p { margin: 12px 0; font-size: 15px; line-height: 1.7; }
  h2 { font-size: 18px; font-weight: 600; margin: 24px 0 10px; }

  .done-screen { text-align: center; padding: 32px 0; }
  .done-screen .done-icon { font-size: 64px; margin-bottom: 16px; }
  .done-screen h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
  .done-screen p { font-size: 16px; color: var(--text-muted); max-width: 460px; margin: 0 auto 24px; }

  .final-checklist { list-style: none; display: flex; flex-direction: column; gap: 10px; margin: 20px 0; text-align: left; }
  .final-checklist li { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .final-checklist li .check { width: 22px; height: 22px; border-radius: 50%; background: var(--success-bg); border: 1px solid var(--success-border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }

  @media (max-width: 600px) {
    .main { padding: 20px 16px 100px; }
    h1.step-title { font-size: 22px; }
    .hero h1 { font-size: 24px; }
    .nav-step-dots { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <span class="phase-label" id="headerPhase">Welcome</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
    </div>
    <span class="step-counter" id="stepCounter">1 / 22</span>
  </div>
</div>

<main class="main" id="mainContent"></main>

<nav class="nav-bar">
  <div class="nav-inner">
    <button class="btn btn-secondary" id="prevBtn" onclick="navigate(-1)" disabled>← Back</button>
    <div class="nav-step-dots" id="dotContainer"></div>
    <button class="btn btn-primary" id="nextBtn" onclick="navigate(1)">Next →</button>
  </div>
</nav>

<script>
// State
let currentStep = 0;
let completedSteps = {};

// Step definitions — skippable:true means show the "already done" bar
const steps = [
  {
    id: 'welcome',
    phase: 'Welcome',
    title: 'Build & Launch Your Website',
    skippable: false,
    render: () => `
      <div class="hero">
        <div class="hero-icon">🌐</div>
        <h1>Build & Launch Your Website</h1>
        <p>A step-by-step guide to building your own website using AI — no coding experience needed.</p>
      </div>
      <div class="tool-grid">
        <div class="tool-card"><div class="tool-icon">🤖</div><div class="tool-name">Claude Code</div><div class="tool-desc">Your AI builder</div><span class="tool-cost paid">$20/mo</span></div>
        <div class="tool-card"><div class="tool-icon">💻</div><div class="tool-name">VS Code</div><div class="tool-desc">Your workspace</div><span class="tool-cost free">Free</span></div>
        <div class="tool-card"><div class="tool-icon">🐙</div><div class="tool-name">GitHub</div><div class="tool-desc">Code storage</div><span class="tool-cost free">Free</span></div>
        <div class="tool-card"><div class="tool-icon">▲</div><div class="tool-name">Vercel</div><div class="tool-desc">Web hosting</div><span class="tool-cost free">Free</span></div>
      </div>
      <div class="callout tip"><div class="callout-icon"></div><div class="callout-body"><strong>Before you start</strong>Prepare your website idea, a short bio, any content you want on the site, and 2–3 websites you like the look of.</div></div>
    `
  },
  {
    id: 'claude-account',
    phase: 'Create Accounts',
    title: 'Create your Claude account',
    skippable: true,
    render: () => `
      <div class="callout cost"><div class="callout-icon"></div><div class="callout-body"><strong>One paid account required</strong>Claude Code requires Claude Pro at $20/month. Everything else is free. You can cancel anytime.</div></div>
      <ol class="steps-list">
        <li><div class="li-content">Go to <strong>claude.ai</strong> and click <strong>Sign Up</strong></div></li>
        <li><div class="li-content">Enter your email and create a password, or sign up with Google</div></li>
        <li><div class="li-content">Verify your email address</div></li>
        <li><div class="li-content">Click your profile icon (bottom left) → <strong>Upgrade to Pro</strong></div></li>
        <li><div class="li-content">Enter billing info and confirm the $20/month subscription</div></li>
      </ol>
      <div class="callout success"><div class="callout-icon"></div><div class="callout-body">You now have access to Claude Code. Keep this tab open — you'll need it when setting up VS Code.</div></div>
    `
  },
  {
    id: 'github-account',
    phase: 'Create Accounts',
    title: 'Create your GitHub account',
    skippable: true,
    render: () => `
      <p><strong>Why GitHub?</strong> Think of it like Google Drive, but for your website's code. It backs up your files and automatically updates your live site every time you make a change.</p>
      <ol class="steps-list">
        <li><div class="li-content">Go to <strong>github.com</strong> → click <strong>Sign up</strong></div></li>
        <li><div class="li-content">Enter your email → click <strong>Continue</strong></div></li>
        <li><div class="li-content">Create a password → click <strong>Continue</strong></div></li>
        <li><div class="li-content">Choose a username — pick something professional like <code>janesmith</code> or <code>jane-creative</code></div></li>
        <li><div class="li-content">Solve the verification puzzle → click <strong>Create account</strong></div></li>
        <li><div class="li-content">Enter the launch code sent to your email</div></li>
      </ol>
      <h2>Set up two-factor authentication</h2>
      <ol class="steps-list">
        <li><div class="li-content">Click your profile photo → <strong>Settings</strong></div></li>
        <li><div class="li-content">Click <strong>Password and authentication</strong> in the left sidebar</div></li>
        <li><div class="li-content">Scroll to <strong>Two-factor authentication</strong> → click <strong>Enable</strong></div></li>
        <li><div class="li-content">Choose <strong>SMS</strong> and follow the steps</div></li>
        <li><div class="li-content">Save your recovery codes somewhere safe</div></li>
      </ol>
    `
  },
  {
    id: 'vercel-account',
    phase: 'Create Accounts',
    title: 'Create your Vercel account',
    skippable: true,
    render: () => `
      <p><strong>Why Vercel?</strong> This is where your website lives on the internet — for free. Sign up using GitHub so both accounts link automatically.</p>
      <ol class="steps-list">
        <li><div class="li-content">Go to <strong>vercel.com</strong> → click <strong>Sign Up</strong></div></li>
        <li><div class="li-content">Select <strong>Continue with GitHub</strong></div></li>
        <li><div class="li-content">In the GitHub popup, click <strong>Authorize Vercel</strong></div></li>
        <li><div class="li-content">Select <strong>Personal</strong> when asked what you're building</div></li>
        <li><div class="li-content">Select the <strong>Hobby</strong> plan — no credit card required</div></li>
      </ol>
      <h2>What the free plan includes</h2>
      <table class="limits-table">
        <thead><tr><th>Resource</th><th>Free limit</th></tr></thead>
        <tbody>
          <tr><td>Projects</td><td>Up to 200</td></tr>
          <tr><td>Deployments per day</td><td>100</td></tr>
          <tr><td>Monthly visitors</td><td>1,000,000</td></tr>
          <tr><td>Custom domains</td><td>50 per project</td></tr>
        </tbody>
      </table>
      <div class="callout warning"><div class="callout-icon"></div><div class="callout-body"><strong>Personal use only</strong>The free plan is for non-commercial personal projects. A portfolio is fine — a revenue-generating business site would need Vercel Pro ($20/mo).</div></div>
    `
  },
  {
    id: 'vscode',
    phase: 'Install Tools',
    title: 'Install VS Code',
    skippable: true,
    render: () => `
      <p><strong>Why VS Code?</strong> VS Code is your workspace — like Microsoft Word, but for building websites. Claude Code lives inside it. Without it, you'd be working in a plain black terminal with no visual interface.</p>
      <ol class="steps-list">
        <li><div class="li-content">Go to <strong>code.visualstudio.com</strong></div></li>
        <li><div class="li-content">Click the big <strong>Download</strong> button for your OS (Mac or Windows)</div></li>
        <li><div class="li-content">Open the downloaded file and follow the install steps</div></li>
        <li><div class="li-content">Open VS Code — you'll see a welcome screen</div></li>
      </ol>
      <div class="callout tip"><div class="callout-icon"></div><div class="callout-body"><strong>Mac tip</strong>When prompted, drag VS Code into your Applications folder so it appears in your dock.</div></div>
    `
  },
  {
    id: 'git',
    phase: 'Install Tools',
    title: 'Install Git',
    skippable: true,
    render: () => `
      <p>Git connects VS Code to GitHub behind the scenes. Install it before Claude Code.</p>
      <ol class="steps-list">
        <li><div class="li-content">Go to <strong>git-scm.com/downloads</strong> and download for your OS</div></li>
        <li><div class="li-content">Run the installer — accept all default options</div></li>
        <li><div class="li-content"><strong>Restart your computer</strong> after Git installs</div></li>
      </ol>
      <div class="callout tip"><div class="callout-icon"></div><div class="callout-body"><strong>Mac users</strong>Open Terminal, type <code>git --version</code> and press Enter. If you see a version number, skip this step.</div></div>
      <h2>Configure Git with your name and email (one-time)</h2>
      <p>Open VS Code → <strong>Terminal → New Terminal</strong>, then run:</p>
      <div class="code-wrap">
        <div class="code-block" id="code-gitconfig">git config --global user.name "Your Name"
git config --global user.email "youremail@example.com"</div>
        <button class="copy-btn" onclick="copyCode('code-gitconfig', this)">Copy</button>
      </div>
      <div class="callout tip"><div class="callout-icon"></div><div class="callout-body">Use the same email address you used for GitHub.</div></div>
    `
  },
  {
    id: 'claude-ext',
    phase: 'Install Tools',
    title: 'Install Claude Code in VS Code',
    skippable: true,
    render: () => `

const total = steps.length;

// Persist state
function save() {
  localStorage.setItem('wt-step', currentStep);
  localStorage.setItem('wt-done', JSON.stringify(completedSteps));
}
function load() {
  const s = localStorage.getItem('wt-step');
  const d = localStorage.getItem('wt-done');
  if (s !== null) currentStep = parseInt(s, 10);
  if (d) completedSteps = JSON.parse(d);
}

function markDone(idx) {
  completedSteps[idx] = true;
  save();
  render();
}
function unmarkDone(idx) {
  delete completedSteps[idx];
  save();
  render();
}

function navigate(dir) {
  if (dir === 1 && currentStep === total - 1) { currentStep = 0; save(); render(); return; }
  currentStep = Math.max(0, Math.min(total - 1, currentStep + dir));
  save();
  render();
}

function render() {
  const step = steps[currentStep];
  const isDone = !!completedSteps[currentStep];

  let topBar = '';
  if (isDone) {
    topBar = `<div class="done-banner">
      <div class="done-banner-left">✅ You've already completed this step</div>
      <button class="done-banner-undo" onclick="unmarkDone(${currentStep})">Undo</button>
    </div>`;
  } else if (step.skippable) {
    topBar = `<div class="skip-bar">
      <span>Already done this step?</span>
      <button class="skip-btn" onclick="markDone(${currentStep}); navigate(1)">Mark done & continue ✓</button>
    </div>`;
  }

  const showTitle = currentStep !== 0 && currentStep !== total - 1;

  document.getElementById('mainContent').innerHTML = `
    <div class="step-card active">
      ${topBar}
      <div class="phase-badge">${step.phase}</div>
      ${showTitle ? `<h1 class="step-title">${step.title}</h1>` : ''}
      ${step.render()}
    </div>`;

  document.getElementById('headerPhase').textContent = step.phase;
  document.getElementById('stepCounter').textContent = `${currentStep + 1} / ${total}`;
  document.getElementById('progressBar').style.width = ((currentStep / (total - 1)) * 100) + '%';
  document.getElementById('prevBtn').disabled = currentStep === 0;
  document.getElementById('nextBtn').textContent = currentStep === total - 1 ? 'Start over' : 'Next →';

  renderDots();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderDots() {
  const c = document.getElementById('dotContainer');
  c.innerHTML = '';
  steps.forEach((_, i) => {
    const d = document.createElement('div');
    const isDone = !!completedSteps[i];
    d.className = 'dot' + (i === currentStep ? ' active' : isDone ? ' done' : '');
    d.title = steps[i].title;
    d.onclick = () => { currentStep = i; save(); render(); };
    c.appendChild(d);
  });
}

// Prompt builder
function buildPrompt() {
  const purpose = v('f-purpose');
  const name = v('f-name');
  const bio = v('f-bio');
  const colors = v('f-colors');
  const feel = v('f-feel');
  const refs = v('f-refs');
  const extraPages = v('f-extra-pages');

  const pages = [...document.querySelectorAll('#mainContent input[type=checkbox]:checked')]
    .map(cb => '- ' + cb.value);
  if (extraPages) pages.push('- ' + extraPages);

  if (!purpose && !name && !bio && pages.length === 0) {
    document.getElementById('prompt-output').innerHTML = '<span class="output-placeholder">Fill in the fields above and your prompt will appear here, ready to copy into Claude Code.</span>';
    return;
  }

  let out = 'I want to build a personal website. Here\'s what I need:\n\n';
  if (purpose) out += `Purpose: ${purpose}\n\n`;
  if (pages.length) out += `Pages I want:\n${pages.join('\n')}\n\n`;
  if (name || bio) {
    out += 'Content:\n';
    if (name) out += `- My name is ${name}\n`;
    if (bio) out += `- ${bio}\n`;
    out += '\n';
  }
  if (colors || feel || refs) {
    out += 'Style:\n';
    if (colors) out += `- Colors I like: ${colors}\n`;
    if (feel) out += `- Feel: ${feel}\n`;
    if (refs) out += `- Websites I like the look of:\n${refs.split('\n').map(r => '  ' + r).join('\n')}\n`;
    out += '\n';
  }
  out += 'Please build this as a simple HTML/CSS website I can deploy to Vercel.';
  document.getElementById('prompt-output').textContent = out;
}

// CLAUDE.md builder
function buildClaudeMd() {
  const desc = v('cm-desc');
  const pages = v('cm-pages');
  const colors = v('cm-colors');
  const decisions = v('cm-decisions');

  if (!desc && !pages && !colors && !decisions) {
    document.getElementById('claude-md-output').innerHTML = '<span class="output-placeholder">Fill in the fields above and your CLAUDE.md content will appear here.</span>';
    return;
  }

  let out = '# My Website Project\n\n';
  if (desc) out += `## What this site is\n${desc}\n\n`;
  if (pages) out += `## Pages on this site\n${pages}\n\n`;
  if (colors) out += `## My preferences\n- Colors and style: ${colors}\n\n`;
  if (decisions) out += `## Things already decided — do not change\n${decisions.split('\n').map(l => l.trim() ? '- ' + l : '').join('\n')}\n\n`;
  out += '## How to pick up where we left off\nRead all files in this folder first, then ask me what I\'d like to change.';

  document.getElementById('claude-md-output').textContent = out;
}

function v(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function copyCode(id, btn) {
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyOutput(id, btn) {
  const el = document.getElementById(id);
  const text = el.querySelector('.output-placeholder') ? '' : el.textContent;
  if (!text) { btn.textContent = 'Nothing yet'; setTimeout(() => btn.textContent = 'Copy', 1500); return; }
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

load();
render();
</script>
